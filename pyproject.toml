[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "AI support agent for the Hiver SDE Intern take-home assignment"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "kagglehub>=0.3",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]
labeling = [
    "streamlit>=1.37",
]
extras = [
    "rapidfuzz>=3.9",
    "mlflow>=2.16",
]

[project.scripts]
hiver-agent = "hiver_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiver_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hiver_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
